<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#fdf2f8;}
select{appearance:none;}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;
const THEMES = {
  default:{id:"default",name:"Rose Studio",emoji:"🌸",bg:"linear-gradient(160deg,#fdf2f8 0%,#fce7f3 60%,#fbcfe8 100%)",header:"linear-gradient(135deg,#be185d,#ec4899)",accent:"#be185d",card:"#fff",text:"#9d174d",subtext:"#be185d",navBg:"#fff",pill:"#fce7f3",starColor:"#f9a8d4",stars:["✦","✧","✶","✷"]},
  swanlake:{id:"swanlake",name:"Swan Lake",emoji:"🦢",bg:"linear-gradient(160deg,#0f172a 0%,#1e3a5f 50%,#0e4d7a 100%)",header:"linear-gradient(135deg,#1e40af,#3b82f6)",accent:"#93c5fd",card:"#1e3a5f",text:"#bfdbfe",subtext:"#93c5fd",navBg:"#0f172a",pill:"#1e3a5f",starColor:"#93c5fd",stars:["🦢","✦","❄","✧"]},
  sleepingbeauty:{id:"sleepingbeauty",name:"Sleeping Beauty",emoji:"👑",bg:"linear-gradient(160deg,#1a0533 0%,#3b0764 50%,#581c87 100%)",header:"linear-gradient(135deg,#7e22ce,#a855f7)",accent:"#e879f9",card:"#2e1065",text:"#f0abfc",subtext:"#e879f9",navBg:"#1a0533",pill:"#2e1065",starColor:"#e879f9",stars:["👑","✦","★","✧"]},
  nutcracker:{id:"nutcracker",name:"Nutcracker",emoji:"🌰",bg:"linear-gradient(160deg,#1c0a00 0%,#431407 50%,#7c2d12 100%)",header:"linear-gradient(135deg,#c2410c,#ea580c)",accent:"#fdba74",card:"#431407",text:"#fed7aa",subtext:"#fdba74",navBg:"#1c0a00",pill:"#431407",starColor:"#fdba74",stars:["❄","✦","⭐","✧"]},
  coppelia:{id:"coppelia",name:"Coppélia",emoji:"🎪",bg:"linear-gradient(160deg,#052e16 0%,#14532d 50%,#166534 100%)",header:"linear-gradient(135deg,#15803d,#22c55e)",accent:"#86efac",card:"#14532d",text:"#bbf7d0",subtext:"#86efac",navBg:"#052e16",pill:"#14532d",starColor:"#86efac",stars:["🎪","✦","✿","✧"]},
};
const POSES_BEGINNER=[
  {id:1,name:"First Position",french:"Première Position",emoji:"🩰",description:"Stand tall with your heels touching and your toes turned out to each side, making a V shape with your feet. Let your arms curve gently in front of you, like you are hugging a big, soft balloon.",tip:"Imagine you are a beautiful tree growing up toward the sunshine!"},
  {id:2,name:"Second Position",french:"Deuxième Position",emoji:"🦢",description:"Step your feet apart so they are about as wide as your shoulders. Both feet are still turned out. Float your arms out to the sides at shoulder height, soft and curved like wings.",tip:"Spread your wings wide like a graceful swan on the lake!"},
  {id:3,name:"Third Position",french:"Troisième Position",emoji:"🌸",description:"Place one foot in front of the other so the heel of your front foot touches the middle of your back foot. One arm curves in front of your tummy and the other floats out to the side.",tip:"Think of your feet making a little T shape on the floor!"},
  {id:4,name:"Plié",french:"Plié",emoji:"🌷",description:"Stand up nice and tall, then slowly bend your knees while keeping your back straight, like you are gently sitting into an invisible chair. Then rise back up smoothly and tall again.",tip:"Melt down like a soft snowflake, then grow back up toward the sky!"},
  {id:5,name:"Demi-Plié",french:"Demi-Plié",emoji:"🌼",description:"This is a small, gentle bend of the knees, only halfway down. Your heels stay flat on the floor the whole time. Many ballet steps start and end here.",tip:"Soft, springy knees, like you are about to bounce up into the air!"},
  {id:6,name:"Relevé",french:"Relevé",emoji:"🌟",description:"Rise up onto the balls of your feet, which is the soft part just behind your toes. Hold yourself very straight and tall and see how long you can balance.",tip:"Grow as tall as a giraffe reaching up for the yummiest leaves on the tree!"},
  {id:7,name:"Tendu",french:"Tendu",emoji:"✨",description:"Slide one foot slowly along the floor, pointing it away from you, until only the very tip of your toe is touching the ground. Keep that leg completely straight and strong.",tip:"Pretend you are drawing a beautiful line on the floor with the tip of your toe!"},
  {id:8,name:"Port de Bras",french:"Port de Bras",emoji:"🕊️",description:"This is the beautiful, flowing movement of your arms from one position to another. Your arms should float like ribbons blowing in a gentle breeze, never stiff or sharp.",tip:"Pretend your arms are made of long silky scarves floating in the wind!"},
];
const POSES_ADVANCED=[
  {id:101,name:"Arabesque",french:"Arabesque",emoji:"⭐",description:"Stand on one leg and stretch your other leg straight out behind you, lifting it as high as you can. Your arms reach forward and back to make one long, beautiful line.",tip:"Reach your fingers toward a shining star in front of you while your back leg stretches to a star behind!"},
  {id:102,name:"Attitude",french:"Attitude",emoji:"💫",description:"This is like an arabesque but the leg behind you bends at the knee, making a nice angle. It is a pose full of personality and character, just like you!",tip:"You have got attitude! Show the whole audience how confident and beautiful you feel!"},
  {id:103,name:"Pirouette",french:"Pirouette",emoji:"🌀",description:"A spin on one leg! You push off with both feet, rise up to relevé on one foot, and spot one point on the wall in front of you to help you stay balanced.",tip:"Pick one spot on the wall and stare at it as you spin. That is the secret to not getting dizzy!"},
  {id:104,name:"Grand Jeté",french:"Grand Jeté",emoji:"🦋",description:"A big, soaring leap where you split your legs wide in the air. One leg reaches forward and the other stretches behind, and for just one magical moment you are flying!",tip:"Imagine you are leaping over a beautiful puddle on the most perfect sunny day!"},
  {id:105,name:"Passé",french:"Passé",emoji:"🦩",description:"One leg lifts with the knee bent, and your pointed toe gently touches the side of your standing knee. It is a strong, elegant resting place between many other steps.",tip:"Your lifted foot is giving your knee a tiny hello! Say hi!"},
  {id:106,name:"Développé",french:"Développé",emoji:"🌺",description:"Slowly and smoothly unfold one leg from passé position until it is fully stretched out in the air. Like a flower slowly opening its petals one by one.",tip:"Unwrap your leg slowly and carefully, like it is the most precious and beautiful gift!"},
  {id:107,name:"Fouetté",french:"Fouetté",emoji:"🌪️",description:"A powerful spinning turn where one leg whips out to the side and then back to help you turn again and again. Famous ballerinas do thirty two of these in a row on stage!",tip:"Whip, whip, whip! Like spinning a pinwheel faster and faster in the breeze!"},
  {id:108,name:"Fifth Position",french:"Cinquième Position",emoji:"👑",description:"Both feet are fully crossed with the heel of your front foot touching the toe of your back foot. This is the most precise and elegant of all five positions.",tip:"Every professional ballerina worked for many years on this position. You are doing something truly amazing!"},
];
const ALL_POSES=[...POSES_BEGINNER,...POSES_ADVANCED];
const MOODS=[{value:1,emoji:"😢",label:"Not fun",color:"#fca5a5"},{value:2,emoji:"😕",label:"A little fun",color:"#fdba74"},{value:3,emoji:"😊",label:"Pretty fun",color:"#fde68a"},{value:4,emoji:"😄",label:"Really fun!",color:"#86efac"},{value:5,emoji:"🤩",label:"BEST ever!",color:"#a5f3fc"}];
const BADGES=[
  {id:"first_class",emoji:"🌱",name:"First Steps",desc:"Logged your very first class!",check:(c,l)=>c.length>=1},
  {id:"five_classes",emoji:"⭐",name:"Rising Star",desc:"Attended 5 classes!",check:(c,l)=>c.length>=5},
  {id:"ten_classes",emoji:"🌟",name:"Devoted Dancer",desc:"Attended 10 classes!",check:(c,l)=>c.length>=10},
  {id:"happy_dancer",emoji:"🤩",name:"Happy Feet",desc:"Gave a class 5 stars!",check:(c,l)=>c.some(cl=>cl.mood===5)},
  {id:"first_pose",emoji:"🩰",name:"First Position",desc:"Learned your first pose!",check:(c,l)=>l.length>=1},
  {id:"five_poses",emoji:"🦢",name:"Graceful Wings",desc:"Learned 5 poses!",check:(c,l)=>l.length>=5},
  {id:"all_beginner",emoji:"🌸",name:"Beginner Star",desc:"Learned all 8 beginner poses!",check:(c,l)=>POSES_BEGINNER.every(p=>l.includes(p.id))},
  {id:"all_advanced",emoji:"👑",name:"Advanced Dancer",desc:"Learned all 8 advanced poses!",check:(c,l)=>POSES_ADVANCED.every(p=>l.includes(p.id))},
  {id:"all_poses",emoji:"🏆",name:"Prima Ballerina",desc:"Learned every single pose!",check:(c,l)=>ALL_POSES.every(p=>l.includes(p.id))},
];
function speakText(text,onEnd){const s=window.speechSynthesis;s.cancel();const say=()=>{const u=new SpeechSynthesisUtterance(text);const vs=s.getVoices();const v=vs.find(v=>v.name.includes("Samantha"))||vs.find(v=>v.lang.startsWith("en"))||vs[0];if(v)u.voice=v;u.rate=0.82;u.pitch=1.15;if(onEnd)u.onend=onEnd;s.speak(u);};if(s.getVoices().length){say();}else{s.addEventListener("voiceschanged",say,{once:true});}}
function stopSpeech(){window.speechSynthesis.cancel();}
function fmtDate(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function buildRecurringDates(start,until,dow){const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];const td=days.indexOf(dow);const dates=[];const s=new Date(start),e=new Date(until);if(isNaN(s)||isNaN(e)||td<0)return dates;let c=new Date(s);while(c.getDay()!==td)c.setDate(c.getDate()+1);while(c<=e){dates.push(new Date(c));c.setDate(c.getDate()+7);}return dates;}
function downloadICS(vevents,fn){const cal=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ballet//EN",...vevents,"END:VCALENDAR"].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([cal],{type:"text/calendar"}));a.download=fn;a.click();}
function buildVEvent(title,date,time,loc,notes){let ds="",de="";try{const d=new Date(time?`${date} ${time}`:date);if(!isNaN(d)){const p=n=>String(n).padStart(2,"0");const f=d=>`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;ds=`DTSTART:${f(d)}`;de=`DTEND:${f(new Date(d.getTime()+3600000))}`;}}catch{}if(!ds){ds=`DTSTART;VALUE=DATE:${date.replace(/\D/g,"")}`;de=ds;}return["BEGIN:VEVENT",`SUMMARY:${title}`,ds,de,loc?`LOCATION:${loc}`:"",notes?`DESCRIPTION:${notes}`:"",`UID:ballet-${Date.now()}@app`,"END:VEVENT"].filter(Boolean).join("\r\n");}
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}};
const Lbl=({t,children})=><div style={{fontSize:11,fontWeight:800,color:t.subtext,marginBottom:5}}>{children}</div>;
const inp=t=>({width:"100%",border:`2px solid ${t.accent}33`,borderRadius:12,padding:"9px 12px",fontSize:13,fontFamily:"'Nunito',sans-serif",outline:"none",color:t.text,background:t.pill,marginBottom:10,display:"block"});
function blankE(){return{title:"",date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),time:"",location:"",note:"",mood:3,recurDay:"Monday",recurUntil:"",addToCalendar:false};}
function HomeTab({t,classes,learnedPoses,setTab,openLog}){const cls=classes.filter(c=>c.type==="class"),perf=classes.filter(c=>c.type==="performance"),wp=POSES_BEGINNER[3];return<div style={{animation:"fadeIn .4s ease"}}><div style={{background:`${t.accent}1a`,borderRadius:20,padding:16,textAlign:"center",marginBottom:12,border:`2px solid ${t.accent}33`}}><div style={{fontSize:36,marginBottom:3}}>🌸</div><div style={{fontFamily:"'Playfair Display',serif",fontSize:19,color:t.accent,fontWeight:700}}>Welcome, little ballerina!</div><div style={{color:t.subtext,fontSize:12,marginBottom:12}}>Keep dancing & keep shining ✨</div><div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}><button style={{background:t.header,color:"#fff",border:"none",borderRadius:50,padding:"9px 18px",fontSize:12,fontWeight:800,cursor:"pointer"}} onClick={()=>openLog("class")}>+ Log Class</button><button style={{background:`${t.accent}22`,color:t.accent,border:`2px solid ${t.accent}55`,borderRadius:50,padding:"9px 16px",fontSize:12,fontWeight:800,cursor:"pointer"}} onClick={()=>openLog("performance")}>🌟 Log Performance</button></div></div><div style={{display:"flex",gap:8,marginBottom:12}}>{[{n:cls.length,l:"Classes 🎉"},{n:learnedPoses.length,l:"Poses Learned"},{n:perf.length,l:"Shows 🌟"}].map((s,i)=><div key={i} style={{flex:1,background:`${t.accent}18`,borderRadius:14,padding:"11px 5px",textAlign:"center",border:`1.5px solid ${t.accent}22`}}><div style={{fontSize:20,fontWeight:800,color:t.accent}}>{s.n}</div><div style={{fontSize:10,color:t.subtext,fontWeight:700}}>{s.l}</div></div>)}</div><div style={{background:`${t.accent}18`,borderRadius:18,padding:15,marginBottom:12,border:`2px solid ${t.accent}33`}}><div style={{fontSize:10,fontWeight:800,color:t.accent,letterSpacing:1,marginBottom:3}}>⭐ POSE OF THE WEEK</div><div style={{fontFamily:"'Playfair Display',serif",fontSize:17,color:t.accent,fontWeight:700}}>{wp.name}</div><div style={{color:t.subtext,fontSize:11,fontStyle:"italic",marginBottom:6}}>{wp.french}</div><div style={{color:t.text,fontSize:12,lineHeight:1.5,marginBottom:8}}>{wp.description}</div><div style={{display:"flex",gap:8}}><button style={{flex:1,background:"none",border:`2px solid ${t.accent}`,color:t.accent,borderRadius:50,padding:"6px 0",fontSize:11,fontWeight:800,cursor:"pointer"}} onClick={()=>setTab("poses")}>See All Poses →</button><button style={{background:t.pill,border:"none",borderRadius:50,padding:"6px 14px",fontSize:11,fontWeight:800,cursor:"pointer",color:t.accent}} onClick={()=>speakText(`${wp.name}. ${wp.description} Tip: ${wp.tip}`,()=>{})}>🔊</button></div></div></div>;}
function ClassesTab({t,classes,openLog}){const cls=classes.filter(c=>c.type==="class"),perf=classes.filter(c=>c.type==="performance");const Sec=({title,icon,items,type})=><div style={{marginBottom:18}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:t.accent,fontWeight:700}}>{icon} {title}</div><button style={{background:t.header,color:"#fff",border:"none",borderRadius:50,padding:"5px 12px",fontSize:11,fontWeight:800,cursor:"pointer"}} onClick={()=>openLog(type)}>+ Add</button></div>{items.length===0&&<div style={{color:t.subtext,fontSize:13,padding:"8px 0"}}>Nothing logged yet.</div>}{items.map(c=>{const m=MOODS.find(x=>x.value===c.mood);return<div key={c.id} style={{background:`${t.accent}18`,borderRadius:14,padding:13,marginBottom:10,borderLeft:`4px solid ${m?m.color:t.accent}`}}><div style={{display:"flex",gap:8}}><span style={{fontSize:22}}>{m?.emoji||"🩰"}</span><div style={{flex:1}}><div style={{fontWeight:800,color:t.accent,fontSize:13}}>{c.title||"Ballet Class"}</div><div style={{color:t.subtext,fontSize:11}}>{c.date}{c.time?` · ${c.time}`:""}{c.location?` · ${c.location}`:""}</div>{c.note&&<div style={{color:t.text,fontSize:12,marginTop:3}}>📝 {c.note}</div>}</div></div><button onClick={()=>openLog(c.type,c)} style={{marginTop:9,width:"100%",background:`${t.accent}11`,border:`1.5px solid ${t.accent}33`,borderRadius:50,padding:"6px 0",fontSize:11,fontWeight:800,cursor:"pointer",color:t.accent}}>✏️ Edit</button></div>;})};</div>;return<div style={{animation:"fadeIn .4s ease"}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:21,color:t.accent,fontWeight:700,marginBottom:13}}>📖 My Classes</div><Sec title="Classes" icon="🩰" items={cls} type="class"/><Sec title="Performances" icon="🌟" items={perf} type="performance"/></div>;}
function PosesTab({t,poses,poseLevel,setPoseLevel,poseIdx,setPoseIdx,learnedPoses,toggleLearned,speaking,handleSpeak}){const pose=poses[Math.min(poseIdx,poses.length-1)],learned=learnedPoses.includes(pose.id);return<div style={{animation:"fadeIn .4s ease"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:11}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:21,color:t.accent,fontWeight:700}}>🦢 Poses</div><div style={{fontSize:11,fontWeight:800,color:`${t.accent}77`}}>{poseIdx+1}/{poses.length}</div></div><div style={{display:"flex",gap:8,marginBottom:12}}>{["beginner","advanced"].map(lv=><button key={lv} onClick={()=>setPoseLevel(lv)} style={{flex:1,border:"none",borderRadius:50,padding:"8px 0",fontSize:12,fontWeight:800,cursor:"pointer",background:poseLevel===lv?t.header:t.pill,color:poseLevel===lv?"#fff":t.accent}}>{lv==="beginner"?"🌸 Beginner":"⭐ Advanced"}</button>)}</div><div style={{display:"flex",justifyContent:"center",gap:6,marginBottom:11,flexWrap:"wrap"}}>{poses.map((_,i)=><button key={i} onClick={()=>setPoseIdx(i)} style={{width:10,height:10,borderRadius:"50%",border:"none",cursor:"pointer",background:i===poseIdx?t.accent:learnedPoses.includes(poses[i].id)?`${t.accent}88`:`${t.accent}33`}}/>)}</div><div style={{background:`${t.accent}18`,borderRadius:20,padding:18,marginBottom:12,border:`2px solid ${t.accent}${learned?"cc":"33"}`}}><div style={{background:`${t.accent}22`,borderRadius:14,padding:"16px 0",textAlign:"center",marginBottom:12,border:`1.5px dashed ${t.accent}55`}}><div style={{fontSize:54,animation:"float 2.2s ease-in-out infinite"}}>{pose.emoji}</div></div><div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:6}}><div><div style={{fontFamily:"'Playfair Display',serif",fontSize:19,color:t.accent,fontWeight:700}}>{pose.name}</div><div style={{color:t.subtext,fontSize:12,fontStyle:"italic"}}>{pose.french}</div></div><button onClick={()=>toggleLearned(pose.id)} style={{flexShrink:0,background:learned?t.header:t.pill,border:`2px solid ${learned?t.accent:t.accent+"44"}`,borderRadius:50,padding:"6px 10px",cursor:"pointer",fontSize:11,fontWeight:800,color:learned?"#fff":t.accent,whiteSpace:"nowrap"}}>{learned?"✓ Learned!":"Mark Learned"}</button></div><div style={{color:t.text,fontSize:13,lineHeight:1.7,marginTop:10,marginBottom:12}}>{pose.description}</div><div style={{background:`${t.accent}22`,borderRadius:12,padding:"9px 13px",fontSize:12,color:t.subtext,lineHeight:1.5,marginBottom:12}}>💡 {pose.tip}</div><button onClick={()=>handleSpeak(pose)} style={{width:"100%",background:speaking?t.header:t.pill,border:`2px solid ${speaking?t.accent:t.accent+"44"}`,borderRadius:50,padding:"10px 0",fontSize:13,fontWeight:800,cursor:"pointer",color:speaking?"#fff":t.accent,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>{speaking?"⏹ Stop":"🔊 Read Aloud"}</button></div><div style={{display:"flex",gap:10}}><button style={{flex:1,background:t.pill,border:"none",borderRadius:50,padding:11,fontSize:12,fontWeight:800,cursor:"pointer",color:t.accent}} onClick={()=>{stopSpeech();setPoseIdx((poseIdx-1+poses.length)%poses.length);}}>← Prev</button><button style={{flex:1,background:t.pill,border:"none",borderRadius:50,padding:11,fontSize:12,fontWeight:800,cursor:"pointer",color:t.accent}} onClick={()=>{stopSpeech();setPoseIdx((poseIdx+1)%poses.length);}}>Next →</button></div></div>;}
function SummaryTab({t,classes,learnedPoses}){const cls=classes.filter(c=>c.type==="class"),perf=classes.filter(c=>c.type==="performance"),earned=BADGES.filter(b=>b.check(cls,learnedPoses)),unearned=BADGES.filter(b=>!b.check(cls,learnedPoses));return<div style={{animation:"fadeIn .4s ease"}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:21,color:t.accent,fontWeight:700,marginBottom:13}}>🏆 My Progress</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:13}}>{[{n:cls.length,l:"Total Classes",e:"🩰"},{n:perf.length,l:"Performances",e:"🌟"},{n:learnedPoses.length,l:"Poses Learned",e:"🦢"},{n:earned.length,l:"Badges Earned",e:"🏅"}].map((s,i)=><div key={i} style={{background:`${t.accent}18`,borderRadius:14,padding:"13px 10px",textAlign:"center",border:`1.5px solid ${t.accent}22`}}><div style={{fontSize:22}}>{s.e}</div><div style={{fontSize:22,fontWeight:800,color:t.accent}}>{s.n}</div><div style={{fontSize:10,color:t.subtext,fontWeight:700}}>{s.l}</div></div>)}</div><div style={{background:`${t.accent}18`,borderRadius:16,padding:14,marginBottom:13,border:`1.5px solid ${t.accent}22`}}><div style={{fontSize:11,fontWeight:800,color:t.accent,marginBottom:8}}>POSES LEARNED ({learnedPoses.length}/{ALL_POSES.length})</div><div style={{height:10,borderRadius:50,background:`${t.accent}22`,marginBottom:10,overflow:"hidden"}}><div style={{height:"100%",borderRadius:50,background:t.header,width:`${(learnedPoses.length/ALL_POSES.length)*100}%`}}/></div><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{ALL_POSES.map(p=><div key={p.id} style={{background:learnedPoses.includes(p.id)?`${t.accent}33`:t.pill,border:`1.5px solid ${learnedPoses.includes(p.id)?t.accent:t.accent+"22"}`,borderRadius:50,padding:"3px 9px",fontSize:10,fontWeight:700,color:learnedPoses.includes(p.id)?t.accent:t.subtext}}>{learnedPoses.includes(p.id)?"✓ ":""}{p.name}</div>)}</div></div>{earned.length>0&&<div style={{background:`${t.accent}18`,borderRadius:16,padding:14,marginBottom:13,border:`1.5px solid ${t.accent}22`}}><div style={{fontSize:11,fontWeight:800,color:t.accent,marginBottom:10}}>BADGES EARNED 🎉</div><div style={{display:"flex",flexWrap:"wrap",gap:9}}>{earned.map(b=><div key={b.id} style={{background:`${t.accent}22`,borderRadius:14,padding:"10px",textAlign:"center",minWidth:78,border:`1.5px solid ${t.accent}44`}}><div style={{fontSize:26,marginBottom:3}}>{b.emoji}</div><div style={{fontSize:10,fontWeight:800,color:t.accent}}>{b.name}</div><div style={{fontSize:9,color:t.subtext,marginTop:2}}>{b.desc}</div></div>)}</div></div>}{unearned.length>0&&<div style={{background:`${t.accent}11`,borderRadius:16,padding:14,border:`1.5px dashed ${t.accent}33`}}><div style={{fontSize:11,fontWeight:800,color:t.subtext,marginBottom:9}}>BADGES TO EARN</div><div style={{display:"flex",flexWrap:"wrap",gap:9}}>{unearned.map(b=><div key={b.id} style={{background:`${t.accent}0d`,borderRadius:14,padding:"10px",textAlign:"center",minWidth:78,opacity:.5}}><div style={{fontSize:26,marginBottom:3,filter:"grayscale(1)"}}>{b.emoji}</div><div style={{fontSize:10,fontWeight:800,color:t.subtext}}>{b.name}</div><div style={{fontSize:9,color:t.subtext,marginTop:2}}>{b.desc}</div></div>)}</div></div>}</div>;}
function SettingsTab({t,themeId,saveTheme}){return<div style={{animation:"fadeIn .4s ease"}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:21,color:t.accent,fontWeight:700,marginBottom:14}}>⚙️ Settings</div><div style={{fontSize:11,fontWeight:800,color:t.subtext,marginBottom:11}}>🎨 CHOOSE YOUR THEME</div>{Object.values(THEMES).map(th=><button key={th.id} onClick={()=>saveTheme(th.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:12,background:themeId===th.id?`${th.accent}22`:t.pill,border:`2px solid ${themeId===th.id?th.accent:t.accent+"22"}`,borderRadius:15,padding:"12px 14px",marginBottom:9,cursor:"pointer",textAlign:"left"}}><div style={{width:42,height:42,borderRadius:11,background:th.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{th.emoji}</div><div style={{flex:1}}><div style={{fontWeight:800,color:themeId===th.id?th.accent:t.text,fontSize:13}}>{th.name}</div></div>{themeId===th.id&&<span style={{color:th.accent,fontSize:16,fontWeight:800}}>✓</span>}</button>)}</div>;}
function BalletApp(){
  const [tab,setTab]=useState("home");
  const [themeId,setThemeId]=useState(()=>load("ballet_theme","default"));
  const [classes,setClasses]=useState(()=>load("ballet_classes",[]));
  const [lp,setLP]=useState(()=>load("ballet_learned",[]));
  const [showLog,setShowLog]=useState(false);
  const [logType,setLogType]=useState("class");
  const [editId,setEditId]=useState(null);
  const [isRec,setIsRec]=useState(false);
  const [entry,setEntry]=useState(blankE());
  const [audioURL,setAudioURL]=useState(null);
  const [recording,setRecording]=useState(false);
  const mrRef=useRef(null),chRef=useRef([]);
  const [poseLevel,setPoseLevel]=useState("beginner");
  const [poseIdx,setPoseIdx]=useState(0);
  const [speaking,setSpeaking]=useState(false);
  const t=THEMES[themeId]||THEMES.default;
  const poses=poseLevel==="beginner"?POSES_BEGINNER:POSES_ADVANCED;
  const openLog=(type,ex=null)=>{setLogType(type);setIsRec(false);setAudioURL(ex?.audioURL||null);if(ex){setEditId(ex.id);setEntry({title:ex.title||"",date:ex.date||"",time:ex.time||"",location:ex.location||"",note:ex.note||"",mood:ex.mood||3,recurDay:"Monday",recurUntil:"",addToCalendar:false});}else{setEditId(null);setEntry(blankE());}setShowLog(true);};
  const saveEntry=()=>{if(editId){const u=classes.map(c=>c.id===editId?{...c,title:entry.title,date:entry.date,time:entry.time,location:entry.location,note:entry.note,mood:entry.mood}:c);setClasses(u);save("ballet_classes",u);setShowLog(false);return;}if(isRec&&entry.recurDay&&entry.recurUntil){const dates=buildRecurringDates(entry.date,entry.recurUntil,entry.recurDay);if(!dates.length){alert("No dates found.");return;}const ne=dates.map((d,i)=>({id:Date.now()+i,type:logType,title:entry.title||"Ballet Class",date:fmtDate(d),time:entry.time,location:entry.location,note:"",mood:3,audioURL:null}));const u=[...ne,...classes];setClasses(u);save("ballet_classes",u);if(entry.addToCalendar)downloadICS(ne.map(e=>buildVEvent(e.title,e.date,e.time,e.location,"")),"classes.ics");}else{const ne={...entry,id:Date.now(),type:logType,title:entry.title||"Ballet Class",audioURL:audioURL||null};const u=[ne,...classes];setClasses(u);save("ballet_classes",u);if(entry.addToCalendar)downloadICS([buildVEvent(ne.title,ne.date,ne.time,ne.location,ne.note)],"class.ics");}setShowLog(false);};
  const startRec=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chRef.current=[];const mr=new MediaRecorder(s);mr.ondataavailable=e=>{if(e.data.size>0)chRef.current.push(e.data);};mr.onstop=()=>{setAudioURL(URL.createObjectURL(new Blob(chRef.current,{type:"audio/webm"})));s.getTracks().forEach(t=>t.stop());};mr.start();mrRef.current=mr;setRecording(true);}catch{alert("Mic needed!");}};
  const stopRec=()=>{if(mrRef.current){mrRef.current.stop();setRecording(false);}};
  const toggleLearned=id=>{const u=lp.includes(id)?lp.filter(x=>x!==id):[...lp,id];setLP(u);save("ballet_learned",u);};
  const handleSpeak=pose=>{if(speaking){stopSpeech();setSpeaking(false);return;}setSpeaking(true);speakText(`${pose.name}. ${pose.description} Tip: ${pose.tip}`,()=>setSpeaking(false));};
  const saveTheme=id=>{setThemeId(id);save("ballet_theme",id);};
  return<div style={{fontFamily:"'Nunito',sans-serif",maxWidth:430,margin:"0 auto",minHeight:"100vh",background:t.bg,display:"flex",flexDirection:"column",position:"relative",overflow:"hidden"}}>
    <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}}>{[...Array(18)].map((_,i)=><span key={i} style={{position:"absolute",left:`${(i*37+11)%100}%`,top:`${(i*53+7)%100}%`,color:t.starColor,opacity:.2,fontSize:i%4===0?"13px":"7px",animation:`twinkle ${2+(i%3)*0.7}s ease-in-out infinite`,animationDelay:`${(i*0.4)%3}s`}}>{t.stars[i%t.stars.length]}</span>)}</div>
    <header style={{background:t.header,padding:"13px 16px 9px",position:"relative",zIndex:2,boxShadow:`0 4px 20px ${t.accent}44`}}><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:32,animation:"float 3s ease-in-out infinite"}}>🩰</span><div><div style={{fontFamily:"'Playfair Display',serif",color:"#fff",fontSize:20,fontWeight:700}}>My Ballet Studio</div><div style={{color:"#ffffff99",fontSize:10,fontWeight:600}}>Your dance journey ✨</div></div><div style={{marginLeft:"auto",background:"#ffffff22",borderRadius:50,padding:"3px 10px",fontSize:10,color:"#fff",fontWeight:700}}>{t.emoji} {t.name}</div></div></header>
    <main style={{flex:1,padding:"13px 13px 82px",position:"relative",zIndex:1,overflowY:"auto"}}>
      {tab==="home"&&<HomeTab t={t} classes={classes} learnedPoses={lp} setTab={setTab} openLog={openLog}/>}
      {tab==="classes"&&<ClassesTab t={t} classes={classes} openLog={openLog}/>}
      {tab==="poses"&&<PosesTab t={t} poses={poses} poseLevel={poseLevel} setPoseLevel={v=>{setPoseLevel(v);setPoseIdx(0);}} poseIdx={poseIdx} setPoseIdx={setPoseIdx} learnedPoses={lp} toggleLearned={toggleLearned} speaking={speaking} handleSpeak={handleSpeak}/>}
      {tab==="summary"&&<SummaryTab t={t} classes={classes} learnedPoses={lp}/>}
      {tab==="settings"&&<SettingsTab t={t} themeId={themeId} saveTheme={saveTheme}/>}
    </main>
    {showLog&&<div style={{position:"fixed",inset:0,background:"#00000077",zIndex:50,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setShowLog(false)}><div style={{background:t.card,borderRadius:"24px 24px 0 0",padding:20,width:"100%",maxWidth:430,maxHeight:"92vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}><div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:t.accent,fontWeight:700,marginBottom:12}}>{editId?"✏️ Edit Entry":logType==="class"?"🩰 Log a Class":"🌟 Log a Performance"}</div><Lbl t={t}>Title</Lbl><input style={inp(t)} placeholder="e.g. Ballet class" value={entry.title} onChange={e=>setEntry({...entry,title:e.target.value})}/><div style={{display:"flex",gap:8}}><div style={{flex:1}}><Lbl t={t}>Date</Lbl><input style={inp(t)} value={entry.date} onChange={e=>setEntry({...entry,date:e.target.value})}/></div><div style={{flex:1}}><Lbl t={t}>Time</Lbl><input style={inp(t)} placeholder="4:00 PM" value={entry.time} onChange={e=>setEntry({...entry,time:e.target.value})}/></div></div><Lbl t={t}>Location</Lbl><input style={inp(t)} placeholder="e.g. Studio A" value={entry.location} onChange={e=>setEntry({...entry,location:e.target.value})}/>{!editId&&logType==="class"&&<button onClick={()=>setIsRec(!isRec)} style={{width:"100%",border:`2px solid ${isRec?t.accent:t.accent+"44"}`,borderRadius:12,padding:"10px 14px",cursor:"pointer",textAlign:"left",background:isRec?`${t.accent}22`:t.pill,marginBottom:10,display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:18}}>🔁</span><div style={{flex:1}}><div style={{fontWeight:800,color:t.accent,fontSize:13}}>Recurring weekly</div></div><span style={{color:t.accent}}>{isRec?"✓":"○"}</span></button>}{isRec&&!editId&&<div style={{background:`${t.accent}11`,borderRadius:14,padding:"12px 14px",marginBottom:10,border:`1.5px solid ${t.accent}33`}}><Lbl t={t}>Repeats every</Lbl><select style={{...inp(t),marginBottom:8}} value={entry.recurDay} onChange={e=>setEntry({...entry,recurDay:e.target.value})}>{["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].map(d=><option key={d}>{d}</option>)}</select><Lbl t={t}>Until</Lbl><input style={inp(t)} placeholder="July 4, 2026" value={entry.recurUntil} onChange={e=>setEntry({...entry,recurUntil:e.target.value})}/></div>}{logType==="class"&&!isRec&&<><Lbl t={t}>How was class?</Lbl><div style={{display:"flex",gap:5,marginBottom:10}}>{MOODS.map(m=><button key={m.value} onClick={()=>setEntry({...entry,mood:m.value})} style={{flex:1,border:`2px solid ${entry.mood===m.value?m.color:"transparent"}`,borderRadius:12,padding:"7px 2px",cursor:"pointer",textAlign:"center",background:entry.mood===m.value?m.color+"33":t.pill,transform:entry.mood===m.value?"scale(1.1)":"scale(1)"}}><div style={{fontSize:22}}>{m.emoji}</div><div style={{fontSize:9,color:t.subtext,fontWeight:700}}>{m.label}</div></button>)}</div></>}{!isRec&&<><Lbl t={t}>Notes</Lbl><textarea style={{...inp(t),resize:"none",height:64}} rows={3} value={entry.note} onChange={e=>setEntry({...entry,note:e.target.value})}/></>}{logType==="class"&&!isRec&&<><Lbl t={t}>🎙 Voice Memo</Lbl>{!audioURL?<button style={{width:"100%",border:"none",borderRadius:50,padding:9,fontSize:12,fontWeight:800,cursor:"pointer",background:recording?"#fca5a5":t.pill,color:t.accent,marginBottom:10}} onClick={recording?stopRec:startRec}>{recording?"⏹ Stop":"🎙 Record"}</button>:<div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center"}}><audio src={audioURL} controls style={{flex:1,height:32}}/><button style={{background:"#fca5a522",border:"none",borderRadius:50,width:28,height:28,cursor:"pointer",color:"#dc2626"}} onClick={()=>setAudioURL(null)}>✕</button></div>}</>}<button onClick={()=>setEntry({...entry,addToCalendar:!entry.addToCalendar})} style={{width:"100%",border:`2px solid ${entry.addToCalendar?t.accent:t.accent+"44"}`,borderRadius:12,padding:"10px 14px",cursor:"pointer",textAlign:"left",background:entry.addToCalendar?`${t.accent}22`:t.pill,marginBottom:14,display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:18}}>📅</span><div style={{flex:1}}><div style={{fontWeight:800,color:t.accent,fontSize:13}}>Add to Apple Calendar</div></div><span style={{color:t.accent}}>{entry.addToCalendar?"✓":"○"}</span></button><div style={{display:"flex",gap:10}}><button style={{flex:1,background:t.pill,border:"none",borderRadius:50,padding:11,fontSize:12,fontWeight:800,cursor:"pointer",color:t.accent}} onClick={()=>setShowLog(false)}>Cancel</button><button style={{flex:2,background:t.header,border:"none",borderRadius:50,padding:11,fontSize:12,fontWeight:800,cursor:"pointer",color:"#fff"}} onClick={saveEntry}>💾 {editId?"Save Changes":isRec?"Add All":`Save ${logType==="class"?"Class":"Performance"}`}</button></div></div></div>}
    <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:t.navBg,borderTop:`2px solid ${t.accent}33`,display:"flex",zIndex:10}}>{[{id:"home",e:"🏠",l:"Home"},{id:"classes",e:"📖",l:"Classes"},{id:"poses",e:"🦢",l:"Poses"},{id:"summary",e:"🏆",l:"Summary"},{id:"settings",e:"⚙️",l:"Settings"}].map(n=><button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"8px 2px",background:tab===n.id?t.pill:"none",border:"none",cursor:"pointer",color:tab===n.id?t.accent:t.accent+"55",gap:1}}><span style={{fontSize:17}}>{n.e}</span><span style={{fontSize:9,fontWeight:800}}>{n.l}</span></button>)}</nav>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(BalletApp));
</script>
